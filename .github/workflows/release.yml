name: Release APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Releases go one at a time. PR builds get a group of their own: in the shared group a waiting
# build is cancelled as soon as another one queues behind it.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'release' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode is the commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Release is signed with the debug key (app/build.gradle.kts), so CI needs the same
      # debug.keystore as the Mac, otherwise the phone refuses to update over it. A key in ~/.android
      # was ignored (every build had a freshly generated one), so the path is passed explicitly.
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -z "$DEBUG_KEYSTORE" ]; then echo "::error::Secret DEBUG_KEYSTORE is not set"; exit 1; fi
          echo "$DEBUG_KEYSTORE" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android | grep SHA256

      - name: Build
        run: ./gradlew assembleRelease

      # PRs only check that the APK builds; releases come from main.
      - name: Publish
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -oP 'baseVersion = "\K[^"]+' app/build.gradle.kts).$(git rev-list --count HEAD)"
          tag="v$version"
          apk="b2-player-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$tag" "$apk" \
            --target "$GITHUB_SHA" \
            --title "$version" \
            --notes "$(git log -1 --pretty=%s)" \
            --latest
